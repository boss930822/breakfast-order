<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早點夜宵 | 線上預訂系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/40 text-slate-800 pb-24 font-sans antialiased">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 bg-amber-500 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="utensils-crossed" class="w-6 h-6"></i>
                <h1 class="font-bold text-xl tracking-wide">早點夜宵</h1>
            </div>
            <button id="viewToggleBtn" onclick="toggleView()" class="bg-amber-600 hover:bg-amber-700 text-xs px-3 py-1.5 rounded-full font-medium transition flex items-center space-x-1 shadow-sm">
                <i data-lucide="chef-hat" class="w-4 h-4"></i>
                <span id="viewToggleText">廚房看板 (KDS)</span>
            </button>
        </div>
    </header>

    <!-- 主體內容區 (顧客端) -->
    <main id="customerView" class="max-w-md mx-auto px-4 pt-4">
        
        <!-- 品牌 Hero 區塊 -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl p-5 text-white shadow-lg mb-5">
            <div class="flex justify-between items-start">
                <div>
                    <span class="bg-amber-600/60 text-amber-100 text-xs px-2.5 py-1 rounded-full font-medium">預訂免排隊</span>
                    <h2 class="text-2xl font-extrabold mt-2 mb-1">早點夜宵 站前店</h2>
                    <p class="text-amber-100 text-xs flex items-center">
                        <i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i> 營業時間：20:00 - 10:00
                    </p>
                </div>
                <div class="bg-white/20 p-2.5 rounded-xl backdrop-blur-sm">
                    <i data-lucide="store" class="w-8 h-8 text-white"></i>
                </div>
            </div>
        </div>

        <!-- 分類導覽列 -->
       <div class="flex flex-wrap gap-2 pb-3 mb-2 sticky top-14 bg-amber-50/90 backdrop-blur-md pt-2 z-30">
            <button onclick="filterCategory('all')" class="cat-btn active bg-amber-500 text-white px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm">全部餐點</button>
            <button onclick="filterCategory('popular')" class="cat-btn bg-white text-slate-600 hover:bg-amber-100 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm border border-slate-100">熱門推薦</button>
            <button onclick="filterCategory('eggroll')" class="cat-btn bg-white text-slate-600 hover:bg-amber-100 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm border border-slate-100">傳統蛋餅</button>
            <button onclick="filterCategory('rice')" class="cat-btn bg-white text-slate-600 hover:bg-amber-100 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm border border-slate-100">飯糰/包子</button>
            <button onclick="filterCategory('noodle')" class="cat-btn bg-white text-slate-600 hover:bg-amber-100 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm border border-slate-100">宵夜麵點</button>
            <button onclick="filterCategory('drink')" class="cat-btn bg-white text-slate-600 hover:bg-amber-100 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm border border-slate-100">特調飲品</button>
        </div>

        <!-- 菜單列表 -->
        <div id="menuContainer" class="space-y-3">
            <!-- 由 JS 動態渲染 -->
        </div>
    </main>

    <!-- 廚房看板 (KDS 視角) -->
    <main id="kdsView" class="max-w-md mx-auto px-4 pt-4 hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-slate-800 flex items-center">
                <i data-lucide="clipboard-list" class="w-5 h-5 mr-2 text-amber-500"></i>
                廚房接單看板 (KDS)
            </h2>
            <span class="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded-full font-medium" id="kdsOrderCount">待處理: 0 筆</span>
        </div>
        <div id="kdsOrdersContainer" class="space-y-3">
            <!-- 由 JS 動態渲染 -->
        </div>
    </main>

    <!-- 懸浮購物車列 (顧客端) -->
    <div id="cartBar" class="fixed bottom-4 left-0 right-0 max-w-md mx-auto px-4 z-40 hidden">
        <div class="bg-slate-900 text-white rounded-2xl p-3 shadow-2xl flex items-center justify-between border border-slate-700">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="openCartModal()">
                <div class="relative bg-amber-500 p-2.5 rounded-xl">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
                </div>
                <div>
                    <div class="text-xs text-slate-400">合計金額</div>
                    <div class="text-lg font-bold text-amber-400">NT$ <span id="cartTotalPrice">0</span></div>
                </div>
            </div>
            <button onclick="openCartModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-2.5 rounded-xl transition shadow-md">
                查看購物車
            </button>
        </div>
    </div>

    <!-- 客製化選單彈窗 (Modal) -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h3 id="modalTitle" class="text-xl font-bold text-slate-800"></h3>
                    <p id="modalPrice" class="text-amber-600 font-semibold"></p>
                </div>
                <button onclick="closeCustomModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-4 my-4">
                <!-- 辣度選單 -->
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">辣度選擇</label>
                    <div class="grid grid-cols-4 gap-2" id="spicyOptions">
                        <button onclick="selectSpicy(this, '不辣')" class="spicy-btn border border-amber-500 bg-amber-50 text-amber-700 font-medium py-1.5 rounded-lg text-sm">不辣</button>
                        <button onclick="selectSpicy(this, '微辣')" class="spicy-btn border border-slate-200 py-1.5 rounded-lg text-sm text-slate-600">微辣</button>
                        <button onclick="selectSpicy(this, '中辣')" class="spicy-btn border border-slate-200 py-1.5 rounded-lg text-sm text-slate-600">中辣</button>
                        <button onclick="selectSpicy(this, '大辣')" class="spicy-btn border border-slate-200 py-1.5 rounded-lg text-sm text-slate-600">大辣</button>
                    </div>
                </div>

                <!-- 加配料選單 -->
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">加料升級</label>
                    <div class="space-y-2" id="addonOptions">
                        <label class="flex items-center justify-between p-2.5 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50">
                            <span class="text-sm text-slate-700 font-medium">加起司</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-500">+NT$ 10</span>
                                <input type="checkbox" value="10" data-name="加起司" onchange="calcModalTotal()" class="addon-checkbox w-4 h-4 text-amber-500 rounded focus:ring-amber-400">
                            </div>
                        </label>
                        <label class="flex items-center justify-between p-2.5 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50">
                            <span class="text-sm text-slate-700 font-medium">加荷包蛋</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-500">+NT$ 15</span>
                                <input type="checkbox" value="15" data-name="加荷包蛋" onchange="calcModalTotal()" class="addon-checkbox w-4 h-4 text-amber-500 rounded focus:ring-amber-400">
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 數量與加入購物車 -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                <div class="flex items-center space-x-3 bg-slate-100 px-3 py-1.5 rounded-xl">
                    <button onclick="changeModalQty(-1)" class="text-slate-500 font-bold px-1 text-lg">-</button>
                    <span id="modalQty" class="font-bold text-slate-800 w-4 text-center">1</span>
                    <button onclick="changeModalQty(1)" class="text-slate-500 font-bold px-1 text-lg">+</button>
                </div>
                <button onclick="confirmAddToCart()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-md">
                    加入購物車 NT$ <span id="modalFinalPrice">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 購物車清單與結帳彈窗 (Modal) -->
    <div id="cartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-800">已點餐點明細</h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div id="cartItemsList" class="space-y-3 mb-4">
                <!-- 購物車品項列表 -->
            </div>

            <div class="bg-amber-50 p-3 rounded-xl mb-4 space-y-2 border border-amber-100">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-600">預計取餐時間</span>
                    <span class="font-bold text-amber-700">約 15 分鐘後</span>
                </div>
                <div class="flex justify-between text-base font-bold text-slate-800 pt-1 border-t border-amber-200/60">
                    <span>總計金額</span>
                    <span class="text-amber-600">NT$ <span id="cartModalTotal">0</span></span>
                </div>
            </div>

            <button onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                <span>送出預訂訂單</span>
            </button>
        </div>
    </div>

    <script>
        // 菜單資料庫
        const menuData = [
            { id: 1, name: '招牌起司蛋餅', category: 'eggroll', price: 45, desc: '特製濃郁起司，搭配酥皮蛋餅', popular: true },
            { id: 2, name: '培根蔥花蛋餅', category: 'eggroll', price: 50, desc: '焦香培根搭配新鮮青蔥', popular: false },
            { id: 3, name: '傳統古早味飯糰', category: 'rice', price: 50, desc: '老油條、肉鬆、酸菜、菜脯', popular: true },
            { id: 4, name: '黑豬肉蒸包 (2顆)', category: 'rice', price: 40, desc: '多汁鮮肉陷，老麵發酵皮', popular: false },
            { id: 5, name: '黑胡椒鐵板麵加蛋', category: 'noodle', price: 65, desc: '夜宵熱銷第一，附半熟荷包蛋', popular: true },
            { id: 6, name: '古早味炒泡麵', category: 'noodle', price: 70, desc: '特調醬汁拌炒，宵夜首選', popular: false },
            { id: 7, name: '濃香冰豆漿', category: 'drink', price: 25, desc: '非基改黃豆每日現磨', popular: true },
            { id: 8, name: '台式冰紅茶', category: 'drink', price: 25, desc: '決明子古早味紅茶', popular: false }
        ];

        let cart = [];
        let orders = [];
        let currentItem = null;
        let selectedSpicy = '不辣';
        let modalQty = 1;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu('all');
            lucide.createIcons();
        });

        // 渲染菜單
        function renderMenu(category) {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            
            const filtered = category === 'all' 
                ? menuData 
                : category === 'popular' 
                    ? menuData.filter(i => i.popular) 
                    : menuData.filter(i => i.category === category);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center hover:shadow-md transition cursor-pointer';
                card.onclick = () => openCustomModal(item);
                card.innerHTML = `
                    <div class="flex-1 pr-3">
                        <div class="flex items-center space-x-2">
                            <h3 class="font-bold text-slate-800 text-base">${item.name}</h3>
                            ${item.popular ? '<span class="bg-red-100 text-red-600 text-[10px] px-1.5 py-0.5 rounded font-bold">熱門</span>' : ''}
                        </div>
                        <p class="text-xs text-slate-400 mt-1 line-clamp-1">${item.desc}</p>
                        <div class="text-amber-600 font-bold text-base mt-2">NT$ ${item.price}</div>
                    </div>
                    <button class="bg-amber-50 hover:bg-amber-500 text-amber-600 hover:text-white p-2.5 rounded-xl transition">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // 分類切換
        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-amber-500', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.add('active', 'bg-amber-500', 'text-white');
            renderMenu(cat);
        }

        // 打開客製化彈窗
        function openCustomModal(item) {
            currentItem = item;
            modalQty = 1;
            selectedSpicy = '不辣';
            
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalPrice').innerText = `NT$ ${item.price}`;
            document.getElementById('modalQty').innerText = modalQty;

            // 重置辣度按鈕
            document.querySelectorAll('.spicy-btn').forEach(btn => {
                btn.className = 'spicy-btn border border-slate-200 py-1.5 rounded-lg text-sm text-slate-600';
            });
            document.querySelectorAll('.spicy-btn')[0].className = 'spicy-btn border border-amber-500 bg-amber-50 text-amber-700 font-medium py-1.5 rounded-lg text-sm';

            // 重置 Checkbox
            document.querySelectorAll('.addon-checkbox').forEach(cb => cb.checked = false);

            calcModalTotal();
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function selectSpicy(btn, level) {
            selectedSpicy = level;
            document.querySelectorAll('.spicy-btn').forEach(b => {
                b.className = 'spicy-btn border border-slate-200 py-1.5 rounded-lg text-sm text-slate-600';
            });
            btn.className = 'spicy-btn border border-amber-500 bg-amber-50 text-amber-700 font-medium py-1.5 rounded-lg text-sm';
        }

        function changeModalQty(delta) {
            if (modalQty + delta >= 1) {
                modalQty += delta;
                document.getElementById('modalQty').innerText = modalQty;
                calcModalTotal();
            }
        }

        // 計算彈窗總金額（已修復解析與轉型問題）
        function calcModalTotal() {
            if (!currentItem) return;
            let basePrice = parseFloat(currentItem.price);
            let addonTotal = 0;

            document.querySelectorAll('.addon-checkbox:checked').forEach(cb => {
                addonTotal += parseFloat(cb.value);
            });

            let finalPrice = (basePrice + addonTotal) * modalQty;
            document.getElementById('modalFinalPrice').innerText = finalPrice;
        }

        // 確認加入購物車
        function confirmAddToCart() {
            let addons = [];
            let addonPrice = 0;
            document.querySelectorAll('.addon-checkbox:checked').forEach(cb => {
                addons.push(cb.getAttribute('data-name'));
                addonPrice += parseFloat(cb.value);
            });

            const cartItem = {
                id: Date.now(),
                name: currentItem.name,
                unitPrice: parseFloat(currentItem.price) + addonPrice,
                qty: modalQty,
                spicy: selectedSpicy,
                addons: addons
            };

            cart.push(cartItem);
            updateCartUI();
            closeCustomModal();
        }

        // 更新購物車 UI
        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartBadge = document.getElementById('cartBadge');
            const cartTotalPrice = document.getElementById('cartTotalPrice');

            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);

            if (totalCount > 0) {
                cartBar.classList.remove('hidden');
                cartBadge.innerText = totalCount;
                cartTotalPrice.innerText = totalPrice;
            } else {
                cartBar.classList.add('hidden');
            }
        }

        // 購物車 Modal
        function openCartModal() {
            const listContainer = document.getElementById('cartItemsList');
            listContainer.innerHTML = '';

            let totalPrice = 0;
            cart.forEach(item => {
                const itemTotal = item.unitPrice * item.qty;
                totalPrice += itemTotal;

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100';
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 text-sm">${item.name}</div>
                        <div class="text-xs text-slate-400 mt-0.5">
                            ${item.spicy} ${item.addons.length > 0 ? '| ' + item.addons.join(', ') : ''}
                        </div>
                        <div class="text-amber-600 font-bold text-xs mt-1">NT$ ${itemTotal}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeCartItemQty(${item.id}, -1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-xs flex items-center justify-center shadow-sm">-</button>
                        <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="changeCartItemQty(${item.id}, 1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-xs flex items-center justify-center shadow-sm">+</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });

            document.getElementById('cartModalTotal').innerText = totalPrice;
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function changeCartItemQty(id, delta) {
            const idx = cart.findIndex(i => i.id === id);
            if (idx !== -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) {
                    cart.splice(idx, 1);
                }
            }
            updateCartUI();
            if (cart.length === 0) {
                closeCartModal();
            } else {
                openCartModal();
            }
        }

        // 送出訂單
        function submitOrder() {
            if (cart.length === 0) return;

            const order = {
                id: 'A' + Math.floor(100 + Math.random() * 900),
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
                items: [...cart],
                total: cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0),
                status: '製作中'
            };

            orders.push(order);
            cart = [];
            updateCartUI();
            closeCartModal();

            alert(`🎉 訂單送出成功！\n您的訂單編號為：${order.id}\n請憑號碼於 15 分鐘後取餐！`);
            renderKDS();
        }

        // 視角切換 (顧客 vs 廚房)
        function toggleView() {
            const customerView = document.getElementById('customerView');
            const kdsView = document.getElementById('kdsView');
            const toggleText = document.getElementById('viewToggleText');
            const cartBar = document.getElementById('cartBar');

            if (kdsView.classList.contains('hidden')) {
                customerView.classList.add('hidden');
                kdsView.classList.remove('hidden');
                cartBar.classList.add('hidden');
                toggleText.innerText = '返回點餐';
                renderKDS();
            } else {
                customerView.classList.remove('hidden');
                kdsView.classList.add('hidden');
                toggleText.innerText = '廚房看板 (KDS)';
                updateCartUI();
            }
        }

        // 渲染廚房看板
        function renderKDS() {
            const container = document.getElementById('kdsOrdersContainer');
            const countBadge = document.getElementById('kdsOrderCount');
            container.innerHTML = '';

            countBadge.innerText = `待處理: ${orders.filter(o => o.status !== '已完成').length} 筆`;

            if (orders.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm">目前尚無新訂單</p>`;
                return;
            }

            orders.forEach(order => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-4 shadow-sm border ${order.status === '已完成' ? 'border-slate-200 opacity-60' : 'border-amber-300'} space-y-3`;
                
                let itemsHtml = order.items.map(i => `
                    <div class="flex justify-between text-sm py-1 border-b border-slate-50">
                        <div>
                            <span class="font-bold text-slate-800">${i.name} × ${i.qty}</span>
                            <div class="text-xs text-amber-600">${i.spicy} ${i.addons.length ? '| ' + i.addons.join(', ') : ''}</div>
                        </div>
                        <span class="font-semibold text-slate-600">NT$ ${i.unitPrice * i.qty}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-slate-900 text-white font-extrabold text-sm px-2.5 py-1 rounded-lg">#${order.id}</span>
                            <span class="text-xs text-slate-400">${order.time} 下單</span>
                        </div>
                        <span class="text-xs font-bold ${order.status === '製作中' ? 'text-amber-600 bg-amber-50' : 'text-emerald-600 bg-emerald-50'} px-2.5 py-1 rounded-full">
                            ${order.status}
                        </span>
                    </div>
                    <div>${itemsHtml}</div>
                    <div class="flex justify-between items-center pt-2">
                        <span class="text-xs text-slate-500">總計：<b class="text-slate-800 text-sm">NT$ ${order.total}</b></span>
                        ${order.status === '製作中' ? `
                            <button onclick="updateOrderStatus('${order.id}', '已完成')" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                                完成出餐
                            </button>
                        ` : '<span class="text-xs text-slate-400">已取餐</span>'}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateOrderStatus(id, newStatus) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.status = newStatus;
                renderKDS();
            }
        }
    </script>
</body>
</html>
